[project]
name = "skill-forge"
version = "0.1.0"
description = "Local CLI pipeline that distills sources into reusable SKILL.md files (Anthropic-style), with license-aware discovery, LLM extraction, and judge-based promotion."
readme = "README.md"
authors = [
    { name = "Mark Westerweel", email = "mark@conduction.nl" }
]
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.104.1",
    "cryptography>=48.0.0",
    "mcp>=1.27.2",
]

[project.scripts]
forge = "skill_forge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pytest-httpserver>=1.1.5",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# skills/ holds imported artifacts (SKILL.md + verbatim upstream helper
# scripts); third-party content is curated, not linted as our code.
extend-exclude = ["skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
