# skill-forge default config.
# Override per-project via config/local.yml (gitignored if you want).

# --- Judge rubric -------------------------------------------------------------
# Each axis scores 0.0 - 1.0. The weighted sum is the total score.
# Weights must sum to 1.0.
rubric:
  # Bump when axes/weights/judge prompt change; recorded in every judge's
  # provenance so a score is tied to the rubric it was produced under.
  version: "1"
  weights:
    schema_compliance: 0.20    # valid frontmatter, expected sections
    clarity:           0.20    # clear "when to use", no unexplained jargon
    actionability:    0.25    # an agent can follow this, not just read it
    gap_coverage:     0.20    # adds something versus existing skills
    provenance_quality: 0.15  # sources clear, license correct, no gaps

# --- Promotion threshold ------------------------------------------------------
# Skill is promoted to live when total >= total_min AND every axis >= axis_min.
promotion:
  total_min: 0.75
  axis_min: 0.50

# --- Judge determinism --------------------------------------------------------
# LLM-as-judge is non-deterministic, so the gate scores N times and takes the
# per-axis median. `temperature` is honored by anthropic/ollama; the default
# claude_code provider (`claude -p`) has no temperature flag, so for it
# median-of-N is the only determinism lever. This bounds variance and makes the
# score auditable/re-checkable — not bit-exact (hosted models drift).
judge:
  runs: 3            # >= 1; 1 disables median (cheap iteration)
  temperature: 0.0

# --- Providers ----------------------------------------------------------------
# Which provider to use per pipeline stage.
# Options: claude_code (uses your Claude Code subscription via `claude -p`),
#          anthropic   (uses ANTHROPIC_API_KEY, pay-per-token, supports forced tool_use),
#          ollama      (local LLM, change #5).
providers:
  extract: claude_code
  judge:   claude_code

anthropic:
  model: claude-opus-4-7
  max_tokens: 4096

claude_code:
  binary: claude
  timeout_s: 120

ollama:
  # Falls back to $OLLAMA_HOST env var if `host` is unset; final default is
  # http://localhost:11434.
  host: ~
  model: llama3.1
  timeout_s: 120

# --- Discovery ----------------------------------------------------------------
discovery:
  max_candidates: 10
  user_agent: "skill-forge/0.1 (+https://github.com/MWest2020/skill-forge)"
  respect_robots_txt: true

# --- Storage paths (relative to project root) ---------------------------------
paths:
  skills: skills
  drafts: skills/_draft
  sources: sources
  runs: runs
